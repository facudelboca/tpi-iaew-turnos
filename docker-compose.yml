services:
  postgres:
    image: postgres:16-alpine
    container_name: iaew-turnos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: ${DB_NAME:-iaew_turnos_db}
      POSTGRES_USER: ${DB_USER:-iaew}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iaew-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iaew} -d ${DB_NAME:-iaew_turnos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: iaew-turnos-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-iaew}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-iaew-local}
      RUNNING_UNDER_SYSTEMD: "true"
    ports:
      - "5672:5672"
      - "15672:15672"
    tmpfs:
      - /var/lib/rabbitmq:uid=999,gid=999,mode=0770

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iaew-turnos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-iaew}:${DB_PASSWORD:-iaew-local}@postgres:5432/${DB_NAME:-iaew_turnos_db}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-iaew_turnos_db}
      DB_USER: ${DB_USER:-iaew}
      DB_PASSWORD: ${DB_PASSWORD:-iaew-local}
      RABBIT_URL: amqp://${RABBIT_USER:-iaew}:${RABBIT_PASS:-iaew-local}@rabbitmq:5672

volumes:
  postgres_data:
